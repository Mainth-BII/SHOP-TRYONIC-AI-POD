name: Tryonic AI — Daily Automated Tests

on:
  # ── 8:00 ICT (01:00 UTC) mỗi ngày ──────────────────────────────────────────
  schedule:
    - cron: "3 1 * * *"    # 08:03 ICT hàng ngày

  # ── Manual trigger ──────────────────────────────────────────────────────────
  workflow_dispatch:

  # ── Push trigger đã tắt — tốn ~90 min mỗi push (3 jobs × 30 min)
  # Bật lại khi cần debug CI bằng cách uncomment khối dưới:
  # push:
  #   branches: [main]
  #   paths:
  #     - "tests/production/daily/**"
  #     - "tests/production/tryon/**"
  #     - "tests/config/**"
  #     - "tests/pages/**"
  #     - "data/**"
  #     - ".github/workflows/daily-tests.yml"

jobs:
  test:
    name: Daily Smoke — PROD env
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Install dependencies ──────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # ── Create output directories ────────────────────────────────────────
      - name: Create output directories
        run: mkdir -p reports screenshots/daily

      # ── Run daily smoke tests ─────────────────────────────────────────────
      - name: Run daily smoke — tests/production/daily/
        id: run_tests
        env:
          CI: "true"
          PYTHONPATH: ${{ github.workspace }}/tests
          PROD_EMAIL: ${{ secrets.PROD_EMAIL }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TEST_ENV: "prod"
        run: |
          python -m pytest tests/production/daily/ \
            --env=prod \
            --browser chromium \
            -v \
            --tb=short \
            -p no:cacheprovider \
            --junit-xml=reports/junit.xml \
            2>&1 | tee reports/test_output.txt
        continue-on-error: true

      # ── Parse results ─────────────────────────────────────────────────────
      - name: Parse test results
        id: results
        run: |
          JUNIT="reports/junit.xml"
          if [ -f "$JUNIT" ]; then
            TOTAL=$(grep -oP 'tests="\K[0-9]+' "$JUNIT" | head -1 || echo "0")
            FAILED=$(grep -oP 'failures="\K[0-9]+' "$JUNIT" | head -1 || echo "0")
            ERRORS=$(grep -oP 'errors="\K[0-9]+' "$JUNIT" | head -1 || echo "0")
            SKIPPED=$(grep -oP 'skipped="\K[0-9]+' "$JUNIT" | head -1 || echo "0")
            PASSED=$((TOTAL - FAILED - ERRORS - SKIPPED))
            echo "total=$TOTAL"    >> $GITHUB_OUTPUT
            echo "passed=$PASSED"  >> $GITHUB_OUTPUT
            echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
            echo "failed=$((FAILED + ERRORS))" >> $GITHUB_OUTPUT
            if [ "$TOTAL" -eq 0 ]; then
              echo "status=ERROR" >> $GITHUB_OUTPUT
            elif [ "$FAILED" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
              echo "status=FAIL"  >> $GITHUB_OUTPUT
            else
              echo "status=PASS"  >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ junit.xml not found — pytest may have failed to start"
            cat reports/test_output.txt 2>/dev/null || true
            echo "total=0"    >> $GITHUB_OUTPUT
            echo "passed=0"   >> $GITHUB_OUTPUT
            echo "skipped=0"  >> $GITHUB_OUTPUT
            echo "failed=0"   >> $GITHUB_OUTPUT
            echo "status=ERROR" >> $GITHUB_OUTPUT
          fi

      # ── Convert junit.xml → report.csv ───────────────────────────────────
      - name: Convert junit.xml to CSV
        if: always()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, csv, os
          src, dst = "reports/junit.xml", "reports/report.csv"
          fields = ["no", "feature", "test_case", "browser", "expected_result", "actual_result", "status", "duration"]
          if not os.path.exists(src):
              open(dst, "w").close()
          else:
              tree = ET.parse(src)
              with open(dst, "w", newline="", encoding="utf-8-sig") as f:
                  w = csv.DictWriter(f, fieldnames=fields)
                  w.writeheader()
                  for i, case in enumerate(tree.getroot().iter("testcase"), 1):
                      cls_parts = case.get("classname", "").split(".")
                      feature   = cls_parts[-2].replace("test_", "") if len(cls_parts) >= 2 else cls_parts[-1]
                      raw_name  = case.get("name", "")
                      if "[" in raw_name:
                          tc_name = raw_name.split("[")[0].replace("test_", "").replace("_", " ")
                          browser = raw_name.split("[")[1].rstrip("]")
                      else:
                          tc_name = raw_name.replace("test_", "").replace("_", " ")
                          browser = "chromium"
                      time_val = case.get("time", "")
                      duration = f"{float(time_val):.1f}s" if time_val else ""
                      fail = case.find("failure"); err = case.find("error"); skip = case.find("skipped")
                      if fail  is not None: actual = (fail.get("message","") or "")[:200]; status = "FAIL"
                      elif err is not None: actual = (err.get("message","")  or "")[:200]; status = "ERROR"
                      elif skip is not None: actual = (skip.get("message","") or "")[:100]; status = "SKIP"
                      else: actual = ""; status = "PASS"
                      w.writerow({"no": i, "feature": feature, "test_case": tc_name,
                                  "browser": browser, "expected_result": "PASS",
                                  "actual_result": actual, "status": status, "duration": duration})
          print("✅ Converted to", dst)
          EOF

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload reports and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-smoke-${{ github.run_number }}
          path: |
            reports/report.csv
            reports/test_output.txt
            reports/daily/*.md
            reports/daily/*.csv
            screenshots/daily/
          retention-days: 14

      # ── Notify Google Chat ────────────────────────────────────────────────
      # Rich notification (per-suite + AI timings + bugs + screenshots) đã được
      # gửi bởi conftest.py trong bước Run daily smoke ở trên (có GOOGLE_CHAT_WEBHOOK_URL).
      # Bước notify cũ đã tắt để tránh gửi 2 lần.
      # - name: Notify Google Chat (legacy — disabled)
      #   if: false

      # ── Fail job only if tests actually ran and failed ────────────────────
      - name: Fail job if tests failed
        if: |
          steps.results.outputs.status == 'FAIL' ||
          steps.results.outputs.status == 'ERROR'
        run: |
          echo "❌ Tests failed: ${{ steps.results.outputs.failed }} failures out of ${{ steps.results.outputs.total }}"
          echo "Status: ${{ steps.results.outputs.status }}"
          cat reports/test_output.txt 2>/dev/null | tail -50 || true
          exit 1

  # ── Tryon Job — chạy song song với smoke, timeout riêng 90 phút ────────────
  tryon-test:
    name: Daily Tryon — AI Thử đồ
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Install dependencies ──────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # ── Create output directories ────────────────────────────────────────
      - name: Create output directories
        run: mkdir -p reports/daily screenshots/daily/tryon

      # ── Run tryon tests ───────────────────────────────────────────────────
      - name: Run tryon — tests/production/tryon/
        id: run_tryon
        env:
          CI: "true"
          PYTHONPATH: ${{ github.workspace }}/tests
          PROD_EMAIL: ${{ secrets.PROD_EMAIL }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
          TEST_ENV: "prod"
        run: |
          python -m pytest tests/production/tryon/ \
            --env=prod \
            --browser chromium \
            -v \
            --tb=short \
            -p no:cacheprovider \
            2>&1 | tee reports/tryon-output.txt
        continue-on-error: true

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload tryon artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tryon-results-${{ github.run_number }}
          path: |
            reports/tryon-output.txt
            reports/daily/tryon_*.md
            reports/daily/tryon_*.csv
            screenshots/daily/tryon/
          retention-days: 14

  # ── Print Tech Job — chạy song song, timeout 60 phút ─────────────────────────
  print-tech-test:
    name: Daily Print Tech — AI Gợi ý Công nghệ in
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Install dependencies ──────────────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # ── Create output directories ────────────────────────────────────────
      - name: Create output directories
        run: mkdir -p reports/daily screenshots/daily/print_tech

      # ── Run print tech tests ──────────────────────────────────────────────
      - name: Run print tech — tests/production/print_tech/
        id: run_print_tech
        env:
          CI: "true"
          PYTHONPATH: ${{ github.workspace }}/tests
          PROD_EMAIL: ${{ secrets.PROD_EMAIL }}
          PROD_PASSWORD: ${{ secrets.PROD_PASSWORD }}
          TEST_ENV: "prod"
        run: |
          python -m pytest tests/production/print_tech/ \
            --env=prod \
            --browser chromium \
            -v \
            --tb=short \
            -p no:cacheprovider \
            2>&1 | tee reports/print-tech-output.txt
        continue-on-error: true

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload print tech artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-tech-results-${{ github.run_number }}
          path: |
            reports/print-tech-output.txt
            reports/daily/print_tech_*.md
            reports/daily/print_tech_*.csv
            screenshots/daily/print_tech/
          retention-days: 14
