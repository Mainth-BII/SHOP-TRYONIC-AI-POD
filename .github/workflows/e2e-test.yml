name: Tryonic AI — E2E Full Flow (TEST env)

# Tách HOÀN TOÀN với daily-tests.yml (PROD). Workflow này LUÔN chạy --env=test
# và đi hết flow (đặt đơn + thanh toán sandbox). Không bao giờ chạm PROD.

on:
  # Chạy tay khi cần
  workflow_dispatch:

  # Lịch riêng (lệch giờ daily để không lẫn log). 01:30 UTC = 08:30 ICT (sau daily).
  schedule:
    - cron: "30 1 * * *"   # 08:30 ICT hàng ngày (sau daily)

jobs:
  e2e:
    name: E2E Full Flow — TEST env
    runs-on: ubuntu-latest
    # 45' để đủ chỗ cho bước 'Lệnh in' poll 'Làm mới' tới READY (export TEST có
    # thể >13 phút) + phần còn lại của lifecycle.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 🔒 Guard: job E2E CHỈ chạy TEST, TUYỆT ĐỐI không PROD ────────────
      - name: Env guard (TEST only — chặn PROD)
        run: |
          F=.github/workflows/e2e-test.yml
          grep -q -- "--env=test" "$F" || { echo "::error::E2E phải chạy --env=test"; exit 1; }
          # Quét pattern PROD nhưng BỎ QUA chính 2 dòng định nghĩa guard (chứa
          # literal pattern + thông điệp lỗi) để tránh guard tự khớp chính nó.
          if grep -vE 'grep -[qv]E|::error::E2E' "$F" \
               | grep -qE "\-\-env=prod|shop\.tryonic\.ai[^.]|tests/production/"; then
            echo "::error::E2E KHÔNG được dính --env=prod / PROD URL / tests/production/"; exit 1; fi
          echo "✅ E2E job → môi trường TEST, chỉ tests/e2e/ (đã khóa thêm ở conftest)"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Create output directories
        run: mkdir -p reports screenshots/daily

      - name: Run E2E full flow — tests/e2e/ (TEST env)
        id: run_e2e
        env:
          CI: "true"
          PYTHONPATH: ${{ github.workspace }}/tests
          # ⚠️ LUÔN TEST — không bao giờ truyền prod ở đây
          TEST_ENV: "test"
          DAILY_TEST_EMAIL: ${{ secrets.DAILY_TEST_EMAIL }}
          DAILY_TEST_PASSWORD: ${{ secrets.DAILY_TEST_PASSWORD }}
          # ⚠️ BẮT BUỘC cho luồng lifecycle (Admin: xác nhận→in→giao→đã giao + email).
          # Thiếu 2 biến này → test_lifecycle bị SKIP → report thiếu suite E2E_LIFECYCLE.
          ADMIN_TEST_EMAIL: ${{ secrets.ADMIN_TEST_EMAIL }}
          ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
          GOOGLE_CHAT_WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK_URL_E2E }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python -m pytest tests/e2e/ \
            --env=test \
            --browser chromium \
            -v \
            -rs \
            --tb=short \
            -p no:cacheprovider \
            --junit-xml=reports/junit-e2e.xml \
            2>&1 | tee reports/e2e_output.txt
        continue-on-error: true

      - name: Upload artifacts (reports + screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            reports/
            screenshots/
          retention-days: 14

      - name: Fail job if tests failed
        if: steps.run_e2e.outcome == 'failure'
        run: |
          echo "E2E full flow có test FAIL — xem artifact e2e-results."
          exit 1
