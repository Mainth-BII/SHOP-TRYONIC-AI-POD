name: Tryonic QA Regression Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 8:00 AM ICT (1:00 AM UTC) & 4:00 PM ICT (9:00 AM UTC)
    - cron: '0 1,9 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Chọn bộ test cần chạy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - production
          - api

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://shop.tryonic.ai/"
      DAILY_TEST_EMAIL: ${{ secrets.DAILY_TEST_EMAIL }}
      DAILY_TEST_PASSWORD: ${{ secrets.DAILY_TEST_PASSWORD }}
      CI: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p tests/screenshots tests/test_reports

      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps chromium

      - name: Run Tests (All)
        if: "${{ github.event.inputs.test_suite == 'all' || github.event_name != 'workflow_dispatch' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          python -m pytest tests/ -v --maxfail=5 \
            --browser chromium \
            --tb=short \
            -p no:cacheprovider

      - name: Run Tests (Daily Only)
        if: "${{ github.event.inputs.test_suite == 'daily' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          python -m pytest tests/daily/ -v \
            --browser chromium \
            --tb=short

      - name: Run Tests (Production Only)
        if: "${{ github.event.inputs.test_suite == 'production' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          python -m pytest tests/production/ -v \
            --browser chromium \
            --tb=short

      - name: Run Tests (API Only)
        if: "${{ github.event.inputs.test_suite == 'api' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          python -m pytest tests/api/ -v \
            --tb=short

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            tests/test_reports/
            screenshots/
            test-results/
          retention-days: 7

      - name: Send Google Chat Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          COLOR="#2eb886"
          [ "$STATUS" != "success" ] && COLOR="#a30200"
          
          MESSAGE="<b>🚀 Tryonic QA Report</b><br>
          <b>Status:</b> ${STATUS}<br>
          <b>Branch:</b> ${{ github.ref_name }}<br>
          <b>Commit:</b> ${{ github.event.head_commit.message }}<br>
          <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Xem chi tiết Report tại đây</a>"
          
          curl -X POST -H "Content-Type: application/json; charset=UTF-8" \
            "${{ secrets.GOOGLE_CHAT_WEBHOOK }}" \
            -d "{\"text\": \"$MESSAGE\"}"
