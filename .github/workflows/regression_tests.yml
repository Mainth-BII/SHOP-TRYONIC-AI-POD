name: Tryonic QA Regression Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 8:00 AM ICT (1:00 AM UTC) & 4:00 PM ICT (9:00 AM UTC)
    - cron: '0 1,9 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Chọn bộ test cần chạy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - production
          - api

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://shop.tryonic.ai/"
      DAILY_TEST_EMAIL: ${{ secrets.DAILY_TEST_EMAIL }}
      DAILY_TEST_PASSWORD: ${{ secrets.DAILY_TEST_PASSWORD }}
      CI: true
      PYTHONPATH: ${{ github.workspace }}/tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p tests/screenshots tests/test_reports

      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps chromium

      - name: Run Tests (All)
        if: "${{ github.event.inputs.test_suite == 'all' || github.event_name != 'workflow_dispatch' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          python -m pytest tests/ -v --maxfail=5 \
            --browser chromium \
            --tb=short \
            --json-report --json-report-file=tests/test_reports/.report.json \
            -p no:cacheprovider

      - name: Run Tests (Daily Only)
        if: "${{ github.event.inputs.test_suite == 'daily' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          python -m pytest tests/daily/ -v \
            --browser chromium \
            --tb=short \
            --json-report --json-report-file=tests/test_reports/.report.json

      - name: Run Tests (Production Only)
        if: "${{ github.event.inputs.test_suite == 'production' }}"
        run: |
          python -m pytest tests/production/test_critical_flows.py -v \
            --browser chromium \
            --env=test \
            --tb=short \
            --json-report --json-report-file=tests/test_reports/.report.json

      - name: Run Tests (API Only)
        if: "${{ github.event.inputs.test_suite == 'api' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          python -m pytest tests/api/ -v \
            --tb=short \
            --json-report --json-report-file=tests/test_reports/.report.json

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            tests/test_reports/
            screenshots/
            test-results/
          retention-days: 7

      - name: Collect Test Results
        if: always()
        id: test_results
        run: |
          # Parse pytest output for stats
          TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0; DURATION="0s"

          if [ -f tests/test_reports/.report.json ]; then
            TOTAL=$(jq '.summary.total // 0' tests/test_reports/.report.json)
            PASSED=$(jq '.summary.passed // 0' tests/test_reports/.report.json)
            FAILED=$(jq '.summary.failed // 0' tests/test_reports/.report.json)
            SKIPPED=$(jq '.summary.skipped // 0' tests/test_reports/.report.json)
            DURATION=$(jq -r '.duration // 0 | tostring + "s"' tests/test_reports/.report.json)
          fi

          # Fallback: count from exit code
          if [ "$TOTAL" = "0" ]; then
            TOTAL=1
            if [ "${{ job.status }}" = "success" ]; then PASSED=1; else FAILED=1; fi
            DURATION="${{ github.run_number }}s"
          fi

          # Pass rate
          if [ "$TOTAL" -gt 0 ]; then
            RATE=$(( PASSED * 100 / TOTAL ))
          else
            RATE=0
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "rate=$RATE" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT

      - name: Send Google Chat Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual trigger' }}
        run: |
          STATUS="${{ job.status }}"
          TOTAL="${{ steps.test_results.outputs.total }}"
          PASSED="${{ steps.test_results.outputs.passed }}"
          FAILED="${{ steps.test_results.outputs.failed }}"
          SKIPPED="${{ steps.test_results.outputs.skipped }}"
          RATE="${{ steps.test_results.outputs.rate }}"
          DURATION="${{ steps.test_results.outputs.duration }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            TITLE="Tryonic AI — ALL TESTS PASSED"
            COLOR="#34A853"
          elif [ "$STATUS" = "cancelled" ]; then
            ICON="⚠️"
            TITLE="Tryonic AI — TESTS CANCELLED"
            COLOR="#FBBC04"
          else
            ICON="❌"
            TITLE="Tryonic AI — TESTS FAILED"
            COLOR="#EA4335"
          fi

          # Build Card v2 JSON
          PAYLOAD=$(cat <<EOF
          {
            "cardsV2": [{
              "cardId": "testReport",
              "card": {
                "header": {
                  "title": "${ICON} ${TITLE}",
                  "subtitle": "https://test.shop.tryonic.ai | Run #${{ github.run_number }} | ${TIMESTAMP}",
                  "imageUrl": "https://shop.tryonic.ai/favicon.ico",
                  "imageType": "CIRCLE"
                },
                "sections": [
                  {
                    "header": "Test Summary",
                    "widgets": [
                      {
                        "decoratedText": {
                          "topLabel": "Results",
                          "text": "Total: <b>${TOTAL}</b>  ✅ Passed: <b>${PASSED}</b>  ❌ Failed: <b>${FAILED}</b>  ⏭️ Skipped: <b>${SKIPPED}</b>"
                        }
                      },
                      {
                        "decoratedText": {
                          "topLabel": "Pass Rate",
                          "text": "<b>${RATE}%</b>  ⏱️ Duration: <b>${DURATION}</b>"
                        }
                      }
                    ]
                  },
                  {
                    "header": "Details",
                    "widgets": [
                      {
                        "decoratedText": {
                          "topLabel": "Branch",
                          "text": "<b>${BRANCH}</b>"
                        }
                      },
                      {
                        "decoratedText": {
                          "topLabel": "Commit",
                          "text": "$(echo "$COMMIT_MSG" | head -c 80)"
                        }
                      }
                    ]
                  },
                  {
                    "widgets": [
                      {
                        "buttonList": {
                          "buttons": [
                            {
                              "text": "View Full Report",
                              "onClick": {
                                "openLink": {
                                  "url": "${RUN_URL}"
                                }
                              }
                            }
                          ]
                        }
                      }
                    ]
                  }
                ]
              }
            }]
          }
          EOF
          )

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            "$WEBHOOK_URL" \
            -d "$PAYLOAD")

          echo "📤 Google Chat notification sent — HTTP $HTTP_CODE"
