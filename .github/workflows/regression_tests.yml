name: Tryonic QA Regression Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 8:00 AM ICT (1:00 AM UTC) & 4:00 PM ICT (9:00 AM UTC)
    - cron: '0 1,9 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Chọn bộ test cần chạy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - production
          - api

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://shop.tryonic.ai/"
      DAILY_TEST_EMAIL: ${{ secrets.DAILY_TEST_EMAIL }}
      DAILY_TEST_PASSWORD: ${{ secrets.DAILY_TEST_PASSWORD }}
      CI: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Tests (All)
        if: "${{ github.event.inputs.test_suite == 'all' || github.event_name != 'workflow_dispatch' }}"
        run: pytest tests/ -v --maxfail=5

      - name: Run Tests (Daily Only)
        if: "${{ github.event.inputs.test_suite == 'daily' }}"
        run: pytest tests/daily/ -v

      - name: Run Tests (Production Only)
        if: "${{ github.event.inputs.test_suite == 'production' }}"
        run: pytest tests/production/ -v

      - name: Run Tests (API Only)
        if: "${{ github.event.inputs.test_suite == 'api' }}"
        run: pytest tests/api/ -v

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            tests/test_reports/
            screenshots/
            test-results/
          retention-days: 7
