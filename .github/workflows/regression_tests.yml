name: Tryonic QA Regression Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # 8:00 AM ICT (1:00 AM UTC) & 4:00 PM ICT (9:00 AM UTC)
    - cron: '0 1,9 * * *'
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Chọn bộ test cần chạy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - daily
          - production
          - api

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: "https://shop.tryonic.ai/"
      DAILY_TEST_EMAIL: ${{ secrets.DAILY_TEST_EMAIL }}
      DAILY_TEST_PASSWORD: ${{ secrets.DAILY_TEST_PASSWORD }}
      CI: true
      PYTHONPATH: ${{ github.workspace }}/tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p tests/screenshots tests/test_reports

      - name: Install Playwright Browsers
        run: python -m playwright install --with-deps chromium

      - name: Run Tests (All)
        if: "${{ github.event.inputs.test_suite == 'all' || github.event_name != 'workflow_dispatch' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
          DAILY_TEST_EMAIL: ${{ secrets.DAILY_TEST_EMAIL }}
          DAILY_TEST_PASSWORD: ${{ secrets.DAILY_TEST_PASSWORD }}
        run: |
          python -m pytest tests/production/daily/ -v \
            --env=test \
            --browser chromium \
            --tb=short \
            --json-report --json-report-file=tests/test_reports/.report.json \
            --junit-xml=tests/test_reports/junit.xml \
            -p no:cacheprovider

      - name: Run Tests (Daily Only)
        if: "${{ github.event.inputs.test_suite == 'daily' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          python -m pytest tests/daily/ -v \
            --browser chromium \
            --tb=short \
            --json-report --json-report-file=tests/test_reports/.report.json

      - name: Run Tests (Production Only)
        if: "${{ github.event.inputs.test_suite == 'production' }}"
        run: |
          python -m pytest tests/production/test_critical_flows.py -v \
            --browser chromium \
            --env=test \
            --tb=short \
            --json-report --json-report-file=tests/test_reports/.report.json

      - name: Run Tests (API Only)
        if: "${{ github.event.inputs.test_suite == 'api' }}"
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          python -m pytest tests/api/ -v \
            --tb=short \
            --json-report --json-report-file=tests/test_reports/.report.json

      - name: Convert junit.xml to CSV
        if: always()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET, csv, os
          src = "tests/test_reports/junit.xml"
          dst = "tests/test_reports/report.csv"
          if not os.path.exists(src):
              open(dst, "w").close()
          else:
              tree = ET.parse(src)
              with open(dst, "w", newline="", encoding="utf-8-sig") as f:
                  w = csv.DictWriter(f, fieldnames=["step", "expect_result", "actual_result"])
                  w.writeheader()
                  for case in tree.getroot().iter("testcase"):
                      name = f"{case.get('classname','')}.{case.get('name','')}"
                      fail  = case.find("failure")
                      err   = case.find("error")
                      skip  = case.find("skipped")
                      if fail  is not None: actual = "❌ FAIL: "  + (fail.get("message","") or "")[:200]
                      elif err is not None: actual = "❌ ERROR: " + (err.get("message","")  or "")[:200]
                      elif skip is not None: actual = "⏭️ SKIP: " + (skip.get("message","") or "")[:100]
                      else: actual = "✅ PASS"
                      w.writerow({"step": name, "expect_result": "PASS", "actual_result": actual})
          print("✅ Converted to", dst)
          EOF

      - name: Upload Test Reports & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            tests/test_reports/report.csv
            tests/test_reports/.report.json
            screenshots/
            test-results/
          retention-days: 7

      - name: Collect Test Results
        if: always()
        id: test_results
        run: |
          TOTAL=0; PASSED=0; FAILED=0; SKIPPED=0; DURATION="0s"
          FAILED_TESTS=""; PASSED_TESTS=""

          if [ -f tests/test_reports/.report.json ]; then
            TOTAL=$(jq '.summary.total // 0' tests/test_reports/.report.json)
            PASSED=$(jq '.summary.passed // 0' tests/test_reports/.report.json)
            FAILED=$(jq '.summary.failed // 0' tests/test_reports/.report.json)
            SKIPPED=$(jq '.summary.skipped // 0' tests/test_reports/.report.json)
            DURATION=$(jq -r '.duration // 0 | tostring + "s"' tests/test_reports/.report.json)

            # Danh sách test FAIL
            FAILED_TESTS=$(jq -r '
              .tests[]
              | select(.outcome == "failed")
              | "❌ " + (.nodeid | split("::")[-1] | split("[")[0])
                + (if (.nodeid | contains("[")) then " [" + (.nodeid | split("[")[1] | rtrimstr("]")) + "]" else "" end)
            ' tests/test_reports/.report.json | head -20 | tr '\n' '|')

            # Danh sách test PASS
            PASSED_TESTS=$(jq -r '
              .tests[]
              | select(.outcome == "passed")
              | "✅ " + (.nodeid | split("::")[-1] | split("[")[0])
                + (if (.nodeid | contains("[")) then " [" + (.nodeid | split("[")[1] | rtrimstr("]")) + "]" else "" end)
            ' tests/test_reports/.report.json | head -20 | tr '\n' '|')
          fi

          if [ "$TOTAL" = "0" ]; then
            TOTAL=1
            if [ "${{ job.status }}" = "success" ]; then PASSED=1; else FAILED=1; fi
            DURATION="${{ github.run_number }}s"
          fi

          if [ "$TOTAL" -gt 0 ]; then
            RATE=$(( PASSED * 100 / TOTAL ))
          else
            RATE=0
          fi

          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "rate=$RATE" >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT
          echo "passed_tests=$PASSED_TESTS" >> $GITHUB_OUTPUT

      - name: Send Google Chat Notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual trigger' }}
        run: |
          STATUS="${{ job.status }}"
          TOTAL="${{ steps.test_results.outputs.total }}"
          PASSED="${{ steps.test_results.outputs.passed }}"
          FAILED="${{ steps.test_results.outputs.failed }}"
          SKIPPED="${{ steps.test_results.outputs.skipped }}"
          RATE="${{ steps.test_results.outputs.rate }}"
          DURATION="${{ steps.test_results.outputs.duration }}"
          FAILED_TESTS="${{ steps.test_results.outputs.failed_tests }}"
          PASSED_TESTS="${{ steps.test_results.outputs.passed_tests }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")

          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            TITLE="Tryonic AI — ALL TESTS PASSED"
          elif [ "$STATUS" = "cancelled" ]; then
            ICON="⚠️"
            TITLE="Tryonic AI — TESTS CANCELLED"
          else
            ICON="❌"
            TITLE="Tryonic AI — TESTS FAILED"
          fi

          # Format test lists (pipe-separated → newline)
          FAILED_LIST=$(echo "$FAILED_TESTS" | tr '|' '\n' | grep -v '^$' | head -10)
          PASSED_LIST=$(echo "$PASSED_TESTS" | tr '|' '\n' | grep -v '^$' | head -10)

          # Build sections JSON
          DETAIL_SECTIONS=""

          if [ -n "$FAILED_LIST" ]; then
            FAILED_TEXT=$(echo "$FAILED_LIST" | sed 's/$/\\n/' | tr -d '\n')
            DETAIL_SECTIONS="${DETAIL_SECTIONS},{\"header\":\"❌ Failed Tests\",\"collapsible\":false,\"widgets\":[{\"textParagraph\":{\"text\":\"${FAILED_TEXT}\"}}]}"
          fi

          if [ -n "$PASSED_LIST" ]; then
            PASSED_TEXT=$(echo "$PASSED_LIST" | sed 's/$/\\n/' | tr -d '\n')
            DETAIL_SECTIONS="${DETAIL_SECTIONS},{\"header\":\"✅ Passed Tests\",\"collapsible\":true,\"widgets\":[{\"textParagraph\":{\"text\":\"${PASSED_TEXT}\"}}]}"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "cardsV2": [{
              "cardId": "testReport",
              "card": {
                "header": {
                  "title": "${ICON} ${TITLE}",
                  "subtitle": "https://test.shop.tryonic.ai | Run #${{ github.run_number }} | ${TIMESTAMP}",
                  "imageUrl": "https://shop.tryonic.ai/favicon.ico",
                  "imageType": "CIRCLE"
                },
                "sections": [
                  {
                    "header": "Test Summary",
                    "widgets": [
                      {
                        "decoratedText": {
                          "topLabel": "Results",
                          "text": "Total: <b>${TOTAL}</b>  ✅ Passed: <b>${PASSED}</b>  ❌ Failed: <b>${FAILED}</b>  ⏭️ Skipped: <b>${SKIPPED}</b>"
                        }
                      },
                      {
                        "decoratedText": {
                          "topLabel": "Pass Rate",
                          "text": "<b>${RATE}%</b>  ⏱️ Duration: <b>${DURATION}</b>"
                        }
                      }
                    ]
                  }
                  ${DETAIL_SECTIONS}
                  ,{
                    "header": "Details",
                    "collapsible": true,
                    "widgets": [
                      {
                        "decoratedText": {
                          "topLabel": "Branch",
                          "text": "<b>${BRANCH}</b>"
                        }
                      },
                      {
                        "decoratedText": {
                          "topLabel": "Commit",
                          "text": "$(echo "$COMMIT_MSG" | head -c 80 | sed 's/"/\\"/g')"
                        }
                      }
                    ]
                  },
                  {
                    "widgets": [
                      {
                        "buttonList": {
                          "buttons": [
                            {
                              "text": "View Full Report",
                              "onClick": {
                                "openLink": {"url": "${RUN_URL}"}
                              }
                            }
                          ]
                        }
                      }
                    ]
                  }
                ]
              }
            }]
          }
          EOF
          )

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json; charset=UTF-8" \
            "$WEBHOOK_URL" \
            -d "$PAYLOAD")

          echo "📤 Google Chat notification sent — HTTP $HTTP_CODE"
