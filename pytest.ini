[pytest]
# Tryonic AI — Playwright Test Suite

# Test discovery — chỉ dùng khi chạy local (CI override bằng command line)
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Playwright browser defaults (local)
addopts =
    -v
    --tb=short

# Markers
markers =
    smoke:      Smoke tests — critical path only (P0)
    regression: Full regression suite
    mobile:     Mobile/responsive tests
    validation: Input validation (negative cases)
    artwork:    Artwork generation tests
    ui:         UI/UX visual tests
    slow:       Tests that take >30s (artwork generation)
    daily:      Daily health checks / monitoring suite
