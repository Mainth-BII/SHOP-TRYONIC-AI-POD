[pytest]
testpaths = tests
pythonpath = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Đăng ký các marker tùy chỉnh để tránh cảnh báo
markers =
    daily: Các test chạy hàng ngày (Daily Regression)
    smoke: Test kiểm tra tính sẵn sàng (Availability)
    production: Test quan trọng trên môi trường Live
    api: Test API backend
    performance: Test hiệu năng/tốc độ tải trang
    mobile: Test giao diện di động
    ui: Test giao diện người dùng
    artwork: Test liên quan đến thiết kế/nghệ thuật
    order: Test luồng đặt hàng

# Custom options — xem thêm: conftest.py → pytest_addoption
# Usage:
#   pytest --env=test    → Môi trường TEST  (test.shop.tryonic.ai)
#   pytest --env=prod    → Môi trường PROD  (shop.tryonic.ai)
#   Mặc định: test (an toàn)
